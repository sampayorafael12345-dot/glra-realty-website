<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Approve · GLRA Social</title>
<script>(function(){var l='glass',d=false;try{l=localStorage.getItem('glra.admin.look')||'glass';d=localStorage.getItem('darkMode')==='true'}catch(e){}if(l!=='glass'&&l!=='bold')l='glass';var h=document.documentElement;h.setAttribute('data-glra-look',l);h.setAttribute('data-glra-mode',d?'dark':'light')})();</script>
<link rel="icon" href="/img/favicon.ico.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" integrity="sha384-3B6NwesSXE7YJlcLI9RpRqGf2p/EgVH8BgoKTaUrmKNDkHPStTQ3EyoYjCGXaOTS" crossorigin="anonymous" referrerpolicy="no-referrer">
<link rel="stylesheet" href="/css/admin-looks.css?v=5">
<link rel="stylesheet" href="/css/social.css?v=1">
<style>.ap{max-width:560px;margin:0 auto;padding:18px 16px 60px}.ap .so-media{grid-template-columns:repeat(auto-fill,minmax(96px,1fr))}</style>
</head>
<body class="so">
<div class="so-bg" aria-hidden="true"></div>
<main class="ap" id="ap"><div class="so-center"><div class="so-spin" role="status" aria-label="Loading"></div></div></main>
<script>
(function () {
  // The one-time token is in the #fragment, so it never reaches a server log or a Referer header.
  var t = (location.hash.match(/t=([A-Za-z0-9_-]{20,80})/) || [])[1] || '';
  history.replaceState(null, '', location.pathname);
  var box = document.getElementById('ap');
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function fmt(d) { return d ? new Date(d).toLocaleString('en-PH', { timeZone: 'Asia/Manila', weekday: 'short', day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' }) : ''; }
  function post(path, body) { return fetch(path, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) }).then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || 'Error ' + r.status); return j; }); }); }
  function done(icon, title, text) { box.innerHTML = '<div class="so-center"><div class="so-card"><h2 style="justify-content:center"><i class="fas ' + icon + '"></i> ' + esc(title) + '</h2><p class="so-muted">' + esc(text) + '</p><a class="so-btn" href="/social.html#approvals">Open GLRA Social</a></div></div>'; }
  if (!t) return done('fa-link-slash', 'No link', 'Open the button from the email again.');
  post('/api/social/link/view', { t: t }).then(function (d) {
    var html = '<div class="so-row" style="margin-bottom:14px"><img src="/img/hero-logo-384.png" alt="" width="34" height="34" style="border-radius:10px;background:#0a0a0a"><div><div style="font-weight:800">GLRA Social</div><div class="so-small so-muted">Signed link for ' + esc(d.approver) + ' · works once</div></div></div>';
    if (d.kind === 'post') {
      var p = d.post, pending = p.status === 'pending';
      html += '<div class="so-card"><h2><i class="fas fa-newspaper"></i>' + esc(p.title || 'Post') + '</h2>' +
        '<div class="so-small so-muted" style="margin-bottom:10px">' + esc(p.targets.map(function (t) { return t.pageName + (t.network === 'ig' ? ' (Instagram)' : ' (Facebook)'); }).join(', ')) + '<br>' + (p.scheduledAt ? '<i class="far fa-clock"></i> ' + esc(fmt(p.scheduledAt)) : 'Publishes as soon as you approve') + ' · by ' + esc((p.createdBy || {}).name || '') + '</div>' +
        (p.media.length ? '<div class="so-media" style="margin-bottom:10px">' + p.media.map(function (m) { return '<div class="so-mi">' + (m.type === 'video' ? '<video src="' + esc(m.url) + '#t=0.5" controls muted></video>' : '<img src="' + esc(m.url) + '" alt="">') + '</div>'; }).join('') + '</div>' : '') +
        '<div class="so-well so-small" style="white-space:pre-wrap">' + esc(p.caption || '(no text)') + '</div>' +
        p.targets.filter(function (t) { return t.caption; }).map(function (t) { return '<div class="so-small so-muted" style="margin:10px 0 4px">' + esc(t.pageName) + (t.network === 'ig' ? ' · Instagram' : ' · Facebook') + ' text</div><div class="so-well so-small" style="white-space:pre-wrap">' + esc(t.caption) + '</div>'; }).join('') +
        (p.link ? '<p class="so-small"><i class="fas fa-link"></i> ' + esc(p.link) + '</p>' : '') +
        (d.check && d.check.errors.length ? '<div class="so-banner bad" style="margin:12px 0 0"><i class="fas fa-circle-xmark"></i><div class="so-small">' + d.check.errors.map(esc).join('<br>') + '</div></div>' : '') +
        (!pending ? '<div class="so-banner info" style="margin:12px 0 0"><i class="fas fa-circle-info"></i><div class="so-small">This post is no longer waiting for approval (' + esc(p.status) + ').</div></div>' : '') + '</div>';
    } else {
      var a = d.action;
      html += '<div class="so-card"><h2><i class="fas fa-comments"></i>' + esc(a.kind === 'reply' ? 'Reply to ' + (d.thread.name || 'someone') : a.kind + ' a comment') + '</h2><div class="so-small so-muted" style="margin-bottom:10px">' + esc(d.thread.pageName) + ' · by ' + esc(a.createdBy.name) + '</div>' +
        '<div class="so-col" style="gap:8px;margin-bottom:10px">' + d.items.map(function (i) { return '<div class="so-msg' + (i.own ? ' own' : '') + '" style="max-width:90%"><div class="bb">' + esc(i.text) + '</div><div class="ft">' + esc(i.own ? 'Page' : i.fromName) + ' · ' + esc(fmt(i.at)) + '</div></div>'; }).join('') + '</div>' +
        (a.text ? '<div class="so-label">The reply</div><div class="so-well so-small" style="white-space:pre-wrap;margin-top:4px">' + esc(a.text) + '</div>' : '') +
        (d.thread.window && !d.thread.window.open ? '<div class="so-banner bad" style="margin:12px 0 0"><i class="fas fa-lock"></i><div class="so-small">' + esc(d.thread.window.why) + '</div></div>' : '') +
        (a.status !== 'pending' ? '<div class="so-banner info" style="margin:12px 0 0"><i class="fas fa-circle-info"></i><div class="so-small">Already handled (' + esc(a.status) + ').</div></div>' : '') + '</div>';
    }
    var open = d.kind === 'post' ? d.post.status === 'pending' : d.action.status === 'pending';
    if (open) html += '<div class="so-card" style="margin-top:14px"><label class="so-field"><span>Note if you send it back (optional)</span><textarea id="note" rows="2"></textarea></label><div class="so-bar" style="margin-top:12px"><button class="so-btn bad" id="no"><i class="fas fa-reply"></i>' + (d.kind === 'post' ? 'Send back' : 'Don\'t send') + '</button><button class="so-btn pri" id="yes"><i class="fas fa-circle-check"></i>Approve</button></div><p class="so-tiny so-muted" style="margin:10px 0 0">Expires ' + esc(fmt(d.expiresAt)) + '.</p></div>';
    box.innerHTML = html;
    function decide(x) {
      document.getElementById('yes').disabled = document.getElementById('no').disabled = true;
      post('/api/social/link/decide', { t: t, decision: x, note: (document.getElementById('note') || {}).value || '' }).then(function (r) {
        done(x === 'approve' ? 'fa-circle-check' : 'fa-reply', x === 'approve' ? 'Approved' : 'Sent back', x === 'approve' ? (r.status === 'scheduled' ? 'It is scheduled.' : r.status === 'published' ? 'It is published.' : 'Done: ' + r.status + '.') : 'The author will see your note.');
      }).catch(function (e) { done('fa-triangle-exclamation', 'Not done', e.message); });
    }
    if (open) { document.getElementById('yes').onclick = function () { decide('approve'); }; document.getElementById('no').onclick = function () { decide('reject'); }; }
  }).catch(function (e) { done('fa-link-slash', 'This link does not work', e.message); });
})();
</script>
</body>
</html>
